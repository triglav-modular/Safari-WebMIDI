<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root { --fg: #1d1d1f; --muted: rgba(60,60,67,.7); --line: rgba(60,60,67,.18); --bg: transparent; --btn: rgba(255,255,255,.55); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f7; --muted: rgba(235,235,245,.6); --line: rgba(255,255,255,.14); --bg: transparent; --btn: rgba(255,255,255,.12); }
  }
  body { margin: 0; width: 300px; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  section { padding: 12px 14px; }
  section + section { border-top: 0.5px solid var(--line); }
  h1 { font-size: 13px; margin: 0 0 6px; }
  h2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .02em; }
  .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin: 4px 0; }
  .site { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { color: var(--muted); white-space: nowrap; }
  /* Transparent page: Safari's popover glass is the background. */
  html { background: transparent; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 3px 12px; background: var(--btn); color: var(--fg); cursor: pointer;
           box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 0 .5px rgba(0,0,0,.1); }
  .empty { color: var(--muted); margin: 0; }
  .detail { color: var(--muted); margin: 4px 0 0; }
  .buttons { justify-content: flex-end; margin-top: 12px; }
  button.primary { background: #000; color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { background: #fff; color: #000; } }
</style>
</head>
<body>
  <section id="ask" hidden>
    <h1 id="askQuestion"></h1>
    <p id="askDetail" class="detail" hidden></p>
    <div class="row buttons"><button id="askBlock"></button><button id="askAllow" class="primary"></button></div>
  </section>
  <section id="here" hidden>
    <h1 id="hereSite"></h1>
    <div class="row"><span id="hereState" class="state"></span><button id="hereForget" hidden></button></div>
  </section>
  <section>
    <h2 id="allTitle"></h2>
    <div id="all"></div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
