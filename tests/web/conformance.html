<!doctype html>
<meta charset="utf-8">
<title>Web MIDI conformance</title>
<script>
  // Before anything else on the page: the API must already be there.
  window.earlyType = typeof navigator.requestMIDIAccess;
</script>
<script>
'use strict';
// Each check is Chromium's behaviour (third_party/blink/renderer/modules/
// webmidi and media/midi) unless it says otherwise.  Run by
// tools/test-webkit.sh; a "WM Loop" virtual port echoes what it is sent.
const results = [];
async function test(name, fn) {
  webkit.messageHandlers.progress.postMessage('start: ' + name);
  try { await fn(); results.push([name, true]); }
  catch (e) { results.push([name, false, (e && e.stack) ? e.message + ' @ ' + e.stack.split('\n')[0] : String(e)]); }
  webkit.messageHandlers.progress.postMessage(JSON.stringify(results[results.length - 1]));
}
function assert(c, msg) { if (!c) throw new Error(msg || 'assertion failed'); }
function eq(a, b, msg) { if (a !== b) throw new Error((msg ? msg + ': ' : '') + JSON.stringify(a) + ' !== ' + JSON.stringify(b)); }
function harness(action, args) { return webkit.messageHandlers.harness.postMessage(Object.assign({ action }, args || {})); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
// A promise that must settle within `ms`, so a step that went wrong fails
// its own test instead of stalling the whole run until the harness gives up.
function within(p, ms, what) {
  return Promise.race([p, sleep(ms).then(() => { throw new Error((what || 'no answer') + ' within ' + ms + ' ms'); })]);
}
// A real click on the toolbar popup's button, tried again until the question
// is gone (the badge clears when it is answered): on a slow CI runner a
// click could land before the popup was ready, and the request then waited
// forever (2 of 4 runs, 2026-09-26).
async function answer(selector) {
  for (let i = 0; i < 5; i++) {
    await harness('decide', { selector });
    for (let k = 0; k < 20; k++) {
      if (await harness('badge') !== '1') return;
      await sleep(50);
    }
  }
  throw new Error('the popup did not take ' + selector);
}
function settled(p) { let s = 'pending'; p.then(() => { s = 'fulfilled'; }, () => { s = 'rejected'; }); return () => s; }
async function rejects(p, name) {
  try { await p; } catch (e) { eq(e.name, name, 'error name'); return e; }
  throw new Error('expected ' + name + ', but it resolved');
}
function throwsSync(fn, name, message) {
  try { fn(); } catch (e) {
    if (name) eq(e.name, name, 'error name');
    if (message) eq(e.message, message, 'message');
    return e;
  }
  throw new Error('expected ' + (name || 'an error'));
}
function waitFor(target, type, pred, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => { target.removeEventListener(type, on); reject(new Error('no ' + type + ' within ' + ms + ' ms')); }, ms);
    function on(e) { if (!pred || pred(e)) { clearTimeout(t); target.removeEventListener(type, on); resolve(e); } }
    target.addEventListener(type, on);
  });
}
function loopOf(access) {
  const out = [...access.outputs.values()].find(p => p.name === 'WM Loop');
  const inp = [...access.inputs.values()].find(p => p.name === 'WM Loop');
  assert(out && inp, 'the WM Loop ports');
  return { out, inp };
}

(async function run() {
  await test('requestMIDIAccess is defined before the page\'s first script runs', () => {
    eq(earlyType, 'function');
  });
  await test('it lives on Navigator.prototype, with length 0', () => {
    const d = Object.getOwnPropertyDescriptor(Navigator.prototype, 'requestMIDIAccess');
    assert(d && d.enumerable && d.writable && d.configurable, 'descriptor');
    eq(navigator.requestMIDIAccess.length, 0);
  });
  await test('interfaces are exposed and cannot be constructed', () => {
    for (const n of ['MIDIAccess', 'MIDIPort', 'MIDIInput', 'MIDIOutput', 'MIDIInputMap', 'MIDIOutputMap']) {
      eq(typeof window[n], 'function', n);
      throwsSync(() => new window[n](), 'TypeError');
    }
    eq(Object.getPrototypeOf(MIDIInput), MIDIPort);
    eq(Object.getPrototypeOf(MIDIPort.prototype), EventTarget.prototype);
  });
  await test('MIDIMessageEvent and MIDIConnectionEvent construct as their IDL says', () => {
    const e = new MIDIMessageEvent('x', { data: new Uint8Array([1, 2]) });
    eq(e.type, 'x'); eq(e.data[1], 2); eq(e.bubbles, false);
    eq(new MIDIMessageEvent('x').data, null);
    throwsSync(() => new MIDIMessageEvent('x', { data: [1, 2] }), 'TypeError');
    eq(new MIDIConnectionEvent('y').port, null);
    throwsSync(() => new MIDIConnectionEvent('y', { port: {} }), 'TypeError');
    eq(Object.prototype.toString.call(e), '[object MIDIMessageEvent]');
  });

  // --- permission ---------------------------------------------------------------
  await harness('grants', { set: '{}' });
  await test('permissions.query({name: "midi"}) is "prompt" before any decision', async () => {
    const st = await navigator.permissions.query({ name: 'midi' });
    assert(st instanceof PermissionStatus, 'a PermissionStatus');
    eq(st.name, 'midi'); eq(st.state, 'prompt');
    eq((await navigator.permissions.query({ name: 'midi', sysex: true })).state, 'prompt');
  });
  await test('other permission names are not answered here', async () => {
    // Whatever Safari says about them, it is not one of ours (they carry
    // their state as an own property).
    const r = await navigator.permissions.query({ name: 'camera' })
      .then(st => Object.getOwnPropertyNames(st).includes('state') ? 'ours' : 'safari', e => 'safari: ' + e.name);
    assert(r !== 'ours', r);
  });
  // The question is asked in the toolbar popup, where the page cannot reach
  // it; the page shows only a notice pointing there, which can say no.
  let p = navigator.requestMIDIAccess();
  const state1 = settled(p);
  await test('a first request asks in the toolbar popup, with a badge', async () => {
    const q = await harness('question');
    assert(q && /Allow \u201c.*\u201d to use your MIDI devices\?/.test(q), q);
    eq(await harness('badge'), '1');
  });
  await test('the page shows a notice pointing there, with no Allow', async () => {
    const n = await harness('notice');
    assert(n && /Answer with the Web MIDI button/.test(n.text), n && n.text);
    eq(n.buttons.join(), 'Not now');
  });
  await test('no click in the page can answer yes', async () => {
    await harness('untrustedClick');
    await sleep(400);
    eq(state1(), 'pending');
  });
  await test('Don\u2019t Allow in the popup rejects with NotAllowedError, and is remembered', async () => {
    await answer('#askBlock');
    const e = await within(rejects(p, 'NotAllowedError'), 5000, 'the refusal');
    eq(e.message, 'Permission to use Web MIDI API was not granted.');
    eq(JSON.parse(await harness('grants'))[location.origin].midi, 'denied');
    eq(await harness('notice'), null, 'the notice goes');
    eq(await harness('badge'), '', 'the badge goes');
  });
  await test('after Don\u2019t Allow the permission state is "denied"', async () => {
    eq((await navigator.permissions.query({ name: 'midi' })).state, 'denied');
  });
  await test('once refused, a request is refused without asking', async () => {
    await rejects(navigator.requestMIDIAccess(), 'NotAllowedError');
    eq(await harness('notice'), null);
    eq(await harness('question', { expect: false }), null);
  });
  await test('the notice\u2019s Not now dismisses without deciding', async () => {
    await harness('grants', { set: '{}' });
    const q = navigator.requestMIDIAccess();
    await sleep(300);
    await harness('noticeClick');
    await rejects(q, 'NotAllowedError');
    const o = JSON.parse(await harness('grants'))[location.origin];
    eq(o.midi, undefined); eq(o.dismissed, 1);
  });
  await test('Escape dismisses too', async () => {
    const q = navigator.requestMIDIAccess();
    await sleep(300);
    await harness('escape');
    await rejects(q, 'NotAllowedError');
    eq(JSON.parse(await harness('grants'))[location.origin].dismissed, 2);
  });
  await test('three dismissals block the site for a week, as Chrome does', async () => {
    const q = navigator.requestMIDIAccess();
    await sleep(300);
    await harness('noticeClick');
    await rejects(q, 'NotAllowedError');
    const o = JSON.parse(await harness('grants'))[location.origin];
    assert(o.embargo > Date.now() + 6 * 24 * 3600 * 1000, 'embargo ' + o.embargo);
    await rejects(navigator.requestMIDIAccess(), 'NotAllowedError');
    eq(await harness('notice'), null, 'not asked while blocked');
    eq((await navigator.permissions.query({ name: 'midi' })).state, 'denied');
    await harness('grants', { set: '{}' });
  });

  let a = null, b = null;
  await test('Allow in the popup resolves a MIDIAccess without sysex', async () => {
    p = navigator.requestMIDIAccess();
    await harness('question');
    await answer('#askAllow');
    a = await within(p, 5000, 'the MIDIAccess');
    assert(a instanceof MIDIAccess);
    eq(a.sysexEnabled, false);
  });
  await test('after Allow, "midi" is granted and "midi" with sysex is still "prompt"', async () => {
    eq((await navigator.permissions.query({ name: 'midi' })).state, 'granted');
    eq((await navigator.permissions.query({ name: 'midi', sysex: true })).state, 'prompt');
  });
  await test('asking for sysex asks again, in stronger words', async () => {
    p = navigator.requestMIDIAccess({ sysex: true });
    const q = await harness('question');
    assert(q && /control and reprogram/.test(q) && /settings and firmware/.test(q), q);
    await answer('#askAllow');
    b = await within(p, 5000, 'the MIDIAccess');
    eq(b.sysexEnabled, true);
  });
  await test('the options dictionary: software is accepted, a non-object is refused', async () => {
    assert((await navigator.requestMIDIAccess({ software: true, sysex: false })) instanceof MIDIAccess);
    await rejects(navigator.requestMIDIAccess(7), 'TypeError');
  });
  await test('once granted, requests resolve without asking', async () => {
    const c = await navigator.requestMIDIAccess();
    eq(await harness('notice'), null);
    assert(c !== a, 'a new MIDIAccess each time');
  });
  if (!a || !b) { webkit.messageHandlers.done.postMessage(results); return; }

  // --- maps and ports --------------------------------------------------------
  await test('inputs and outputs are new maps on each read', () => {
    assert(a.inputs !== a.inputs);
    assert(a.inputs instanceof MIDIInputMap && a.outputs instanceof MIDIOutputMap);
    eq(Object.prototype.toString.call(a.outputs), '[object MIDIOutputMap]');
  });
  await test('the maps are readonly maplike', () => {
    const m = a.outputs;
    eq(typeof m.set, 'undefined'); eq(typeof m.delete, 'undefined');
    eq(m[Symbol.iterator], m.entries);
    const keys = [...m.keys()];
    eq(keys.length, m.size);
    for (const [k, v] of m) { eq(v.id, k); assert(m.has(k)); eq(m.get(k), v); }
    let n = 0; m.forEach((v, k, map) => { eq(map, m); n++; }); eq(n, m.size);
  });
  let loop;
  await test('ports carry CoreMIDI’s names and signed decimal ids', () => {
    loop = loopOf(a);
    assert(/^-?\d+$/.test(loop.out.id), loop.out.id);
    eq(loop.out.type, 'output'); eq(loop.inp.type, 'input');
    eq(loop.out.state, 'connected'); eq(loop.out.connection, 'closed');
    eq(typeof loop.out.manufacturer, 'string'); eq(typeof loop.out.version, 'string');
  });
  await test('open() resolves in a later task, with statechange on the port then the access', async () => {
    const order = [];
    const onPort = e => order.push('port:' + e.port.connection);
    const onAccess = e => { if (e.port === loop.out) order.push('access:' + e.port.connection); };
    loop.out.addEventListener('statechange', onPort);
    a.addEventListener('statechange', onAccess);
    const q = loop.out.open();
    eq(loop.out.connection, 'closed');
    await Promise.resolve();
    eq(loop.out.connection, 'closed', 'still closed after a microtask');
    eq(await q, loop.out);
    eq(loop.out.connection, 'open');
    eq(order.join(), 'port:open,access:open');
    loop.out.removeEventListener('statechange', onPort);
    a.removeEventListener('statechange', onAccess);
    eq(await loop.out.open(), loop.out, 'open again resolves at once');
  });
  await test('close() closes, and open() reopens', async () => {
    await loop.out.close();
    eq(loop.out.connection, 'closed');
    await loop.out.open();
    eq(loop.out.connection, 'open');
  });
  await test('setting onmidimessage opens the input', async () => {
    eq(loop.inp.connection, 'closed');
    loop.inp.onmidimessage = () => {};
    await waitFor(loop.inp, 'statechange', null, 1000);
    eq(loop.inp.connection, 'open');
    loop.inp.onmidimessage = null;
  });
  await test('so does addEventListener("midimessage") on another access’s input', async () => {
    const l = loopOf(b);
    eq(l.inp.connection, 'closed');
    l.inp.addEventListener('midimessage', () => {});
    await waitFor(l.inp, 'statechange', null, 1000);
    eq(l.inp.connection, 'open');
  });

  // --- sending: Blink's MessageValidator and its messages -------------------
  await test('send() validates as Blink does', () => {
    const o = loop.out;
    throwsSync(() => o.send([0x3c, 0x7f]), 'TypeError', 'Running status is not allowed at index 0 (60).');
    throwsSync(() => o.send([0xf4]), 'TypeError', 'Reserved status is not allowed at index 0 (244).');
    throwsSync(() => o.send([0xf7]), 'TypeError', 'Unexpected end of system exclusive message at index 0 (247).');
    throwsSync(() => o.send([0x90, 0x3c]), 'TypeError', 'Message is incomplete.');
    throwsSync(() => o.send([0x90, 0x3c, 0x80]), 'TypeError', 'Unexpected status byte at index 2 (128).');
    throwsSync(() => o.send([0x90, 256, 1]), 'TypeError', 'The value at index 1 (256) is greater than 0xFF.');
    throwsSync(() => o.send([0x90, -1, 1]), 'TypeError', 'The value at index 1 (4294967295) is greater than 0xFF.');
    throwsSync(() => o.send([0xf0, 1, 0xf7]), 'NotAllowedError', 'System exclusive message is not allowed at index 0 (240).');
    throwsSync(() => o.send(5), 'TypeError');
    throwsSync(() => o.send(), 'TypeError');
    throwsSync(() => o.send([0x90, 1, 1], Infinity), 'TypeError');
    o.send([0xf8, 0x90, 0xf8, 0x3c, 0xfe, 0x7f]);      // real time may sit anywhere
    o.send(new Uint8Array([0x80, 0x3c, 0]));
    o.send([]);
  });
  await test('a message goes out and comes back as a midimessage event', async () => {
    const got = waitFor(loop.inp, 'midimessage', e => e.data[0] === 0x92, 2000);
    loop.inp.onmidimessage = () => {};
    const t0 = performance.now();
    loop.out.send([0x92, 60, 99]);
    const e = await got;
    assert(e instanceof MIDIMessageEvent);
    eq([...e.data].join(), '146,60,99');
    eq(e.bubbles, true); eq(e.cancelable, false);
    assert(e.timeStamp >= t0 - 5 && e.timeStamp <= performance.now() + 5, 'timeStamp ' + e.timeStamp + ' vs ' + t0);
  });
  await test('messages keep their order', async () => {
    const seen = [];
    const done = new Promise(r => { loop.inp.onmidimessage = e => { if (e.data[0] === 0xb1) { seen.push(e.data[2]); if (seen.length === 64) r(); } }; });
    for (let i = 0; i < 64; i++) loop.out.send([0xb1, 7, i]);
    await Promise.race([done, sleep(3000)]);
    eq(seen.join(), [...Array(64).keys()].join());
  });
  // What reached the loop's destination at or after `from`, as [ms, status,
  // data1, data2, CoreMIDI's time for it], all on the harness's clock (its
  // uptime): `from` comes from harness('mark').  Never compared with the page's clock, which can run
  // tens of milliseconds apart from the wall clock (a CI runner's did).
  const mark = () => harness('mark');
  async function arrivalsSince(from) {
    const list = await harness('arrivals', { from });
    return list.map(([ms, w, stamp]) => [ms, (w >>> 16) & 0xff, (w >>> 8) & 0xff, w & 0xff, stamp]);
  }
  // The 218e calibration sweep's pattern, with an input open as the sweep
  // has: note-off, 60 ms, note-on, then listening.  Safari runs one native
  // request at a time, so a receive left open held note-ons back by up to a
  // second; and it refuses requests past its limit (the harness counts them
  // as Safari does), which lost 18 of 65 notes in a sweep.  Eight seconds,
  // past the five that Safari holds each request for.
  await test('the sweep\u2019s off, 60 ms, on: every note-on goes promptly, after its note-off, and Safari refuses nothing', async () => {
    loop.inp.onmidimessage = () => {};
    await harness('safari', { reset: true });
    const m0 = await mark(), sent = new Map();
    for (let i = 0; i < 16; i++) {
      loop.out.send([0x85, 40 + i, 0]);
      await sleep(60);
      sent.set(50 + i, await mark());
      loop.out.send([0x95, 50 + i, 100]);
      await sleep(250 + Math.random() * 400);
    }
    await sleep(300);
    const got = await arrivalsSince(m0), off = new Map(), on = new Map();
    got.forEach(a => { if (a[1] === 0x85) off.set(a[2], a[0]); if (a[1] === 0x95) on.set(a[2], a[0]); });
    const late = [...sent].map(([n, t]) => on.has(n) ? on.get(n) - t : Infinity);
    const gaps = [...sent.keys()].map(n => on.has(n) && off.has(n - 10) ? on.get(n) - off.get(n - 10) : -1);
    const safari = await harness('safari');
    assert(Math.max(...late) < 30, 'note-on arrived after ' + late.map(x => x.toFixed(0)).join(' ') + ' ms');
    assert(Math.min(...gaps) > 40, 'note-off to note-on ' + gaps.map(x => x.toFixed(0)).join(' ') + ' ms');
    eq(safari.refusals, 0, 'requests Safari refused (its count peaked at ' + safari.peak + ')');
  });
  await test('a burst of sends past Safari\u2019s request limit arrives whole and in order', async () => {
    loop.inp.onmidimessage = () => {};
    await harness('safari', { reset: true });
    const m0 = await mark(), n = 1500;
    for (let i = 0; i < n; i++) { loop.out.send([0xb3, i >> 7, i & 127]); if (i % 3 === 2) await sleep(2); }
    let got = [];
    for (let k = 0; k < 150 && got.length < n; k++) {
      await sleep(100);
      got = (await arrivalsSince(m0)).filter(a => a[1] === 0xb3);
    }
    const seen = new Set(got.map(a => a[2] * 128 + a[3]));
    const missing = [...Array(n).keys()].filter(i => !seen.has(i));
    const safari = await harness('safari');
    eq(got.length, n, 'arrived (missing ' + (missing.length > 12 ? missing.slice(0, 6).join(' ') + ' ... ' + missing.slice(-6).join(' ') : missing.join(' ')) +
       '; refused ' + safari.refusals + ', failed at the hub ' + safari.sendFailures + ', packets holding several ' + safari.sharedPackets + ')');
    eq(got.map(a => a[2] * 128 + a[3]).join(), [...Array(n).keys()].join());
  });
  // A page that paces its sends, as the 218e settings push does: bursts of
  // 16 made a few ms apart, so the instrument's 32-packet receive ring can
  // drain.  Safari takes one native request at a time, so the extension gets
  // them in batches, and sent back to back a batch arrived in runs of up to
  // 80 (2026-09-27).  CoreMIDI's time for each send says when it was meant
  // to go, whatever the runner's load made of its arrival: each burst's must
  // be the page's gap after the one before (at least 4 ms here).
  await test('a batch of sends keeps the page\u2019s spacing', async () => {
    loop.inp.onmidimessage = () => {};
    const m0 = await mark(), bursts = 40;
    for (let k = 0; k < bursts; k++) {
      for (let i = 0; i < 16; i++) loop.out.send([0xb4, k, i]);
      await sleep(4);
    }
    let got = [];
    for (let t = 0; t < 50 && got.length < bursts * 16; t++) {
      await sleep(100);
      got = (await arrivalsSince(m0)).filter(a => a[1] === 0xb4);
    }
    const ids = got.map(a => a[2] * 16 + a[3]), wrong = ids.findIndex((x, i) => x !== i);
    assert(ids.length === bursts * 16 && wrong < 0, ids.length + ' of ' + bursts * 16 + ' arrived' + (wrong < 0 ? '' : ', out of order from ' +
      got.slice(Math.max(0, wrong - 2), wrong + 6).map(a => (a[2] * 16 + a[3]) + '@' + a[4].toFixed(2)).join(' ')));
    const first = [...Array(bursts).keys()].map(k => got[k * 16][4]);
    const gaps = first.slice(1).map((t, k) => t - first[k]);
    assert(gaps.every(g => g >= 3), 'bursts went ' + gaps.map(g => g.toFixed(1)).join(' ') + ' ms apart');
  });
  await test('a send Safari refuses is tried again, not lost', async () => {
    loop.inp.onmidimessage = () => {};
    const m0 = await mark();
    await harness('safari', { reset: true, refuseNext: 3 });
    loop.out.send([0x96, 1, 1]);
    await sleep(1500);
    const safari = await harness('safari');
    assert(safari.refusals >= 3, 'refused ' + safari.refusals);
    eq((await arrivalsSince(m0)).filter(a => a[1] === 0x96).length, 1);
  });
  await test('a timestamp delays the send', async () => {
    // Due 250 ms after a moment between two harness marks, so on the
    // harness's clock it must arrive 250 ms after the first, give or take
    // the time between them.
    const m1 = await mark();
    const due = performance.now() + 250;
    const m2 = await mark();
    const got = waitFor(loop.inp, 'midimessage', e => e.data[0] === 0x93, 2000);
    loop.out.send([0x93, 1, 1], due);
    const e = await got;
    // At the destination, on time; back at the page, after the receive
    // path's own delay (a page that has just sent checks every 50 ms).
    const at = (await arrivalsSince(m1)).find(a => a[1] === 0x93);
    const early = at ? at[0] - (m1 + 250) : -Infinity, late = at ? at[0] - (m2 + 250) : Infinity;
    const back = performance.now() - due;
    // Arrival on a busy CI runner came 50 ms late with CoreMIDI's timestamp
    // exact, as in the hub test; the timestamp below is the exact check.
    assert(early > -5 && late < 150, 'arrived ' + early.toFixed(1) + ' to ' + late.toFixed(1) + ' ms from due');
    assert(back > -5 && back < 150, 'came back ' + back.toFixed(1) + ' ms from due');
    assert(Math.abs(e.timeStamp - due) < 15, 'timeStamp ' + (e.timeStamp - due).toFixed(1) + ' ms from due');
  });
  await test('clear() drops a send that has not gone yet', async () => {
    let arrived = false;
    loop.inp.onmidimessage = e => { if (e.data[0] === 0x94) arrived = true; };
    loop.out.send([0x94, 1, 1], performance.now() + 300);
    loop.out.clear();
    await sleep(600);
    eq(arrived, false);
  });

  // --- sysex ---------------------------------------------------------------------
  await test('sysex goes out and back whole on a sysex access', async () => {
    const l = loopOf(b);
    const big = [0xf0, 0x7d, ...Array.from({ length: 3000 }, (_, i) => i % 128), 0xf7];
    const got = waitFor(l.inp, 'midimessage', e => e.data[0] === 0xf0 && e.data.length === big.length, 3000);
    l.inp.onmidimessage = () => {};
    l.out.send(big);
    const e = await got;
    eq([...e.data].join(), big.join());
  });
  await test('an access without sysex never sees it', async () => {
    let seen = false;
    loop.inp.onmidimessage = e => { if (e.data[0] === 0xf0) seen = true; };
    loopOf(b).out.send([0xf0, 1, 2, 0xf7]);
    await sleep(400);
    eq(seen, false);
  });

  // --- ports that come and go ---------------------------------------------------
  let hot;
  await test('a new port is announced on the access only', async () => {
    const got = waitFor(a, 'statechange', e => e.port && e.port.name === 'WM Hot' && e.port.type === 'output', 4000);
    await harness('plug', { name: 'WM Hot' });
    const e = await got;
    hot = e.port;
    assert(e instanceof MIDIConnectionEvent);
    eq(hot.state, 'connected'); eq(hot.connection, 'closed');
    eq(a.outputs.get(hot.id), hot);
  });
  await test('an unplugged port turns disconnected and leaves the maps', async () => {
    await hot.open();
    const got = waitFor(hot, 'statechange', e => e.port.state === 'disconnected', 4000);
    await harness('unplug', { name: 'WM Hot' });
    await got;
    eq(hot.connection, 'pending');
    eq(a.outputs.has(hot.id), false);
    hot.send([0x90, 1, 1]);                  // Chrome drops it quietly
  });

  // --- frames: the "midi" Permissions Policy, default allowlist 'self' ----------
  let frames = 0;
  async function frame(src, allow) {
    // A URL of its own for each frame, so frames are told apart.
    src += (src.includes('?') ? '&' : '?') + 'n=' + (++frames);
    const f = document.createElement('iframe');
    if (allow !== undefined) f.setAttribute('allow', allow);
    const answer = new Promise(r => addEventListener('message', function on(e) {
      if (e.source === f.contentWindow) { removeEventListener('message', on); r(e.data); }
    }));
    f.src = src;
    document.body.append(f);
    return Promise.race([answer, sleep(5000).then(() => 'no answer')]);
  }
  await test('a same-origin frame shares the grant', async () => {
    eq(await frame('/frame.html'), 'MIDIAccess');
  });
  const other = location.protocol + '//' + location.hostname + ':' + (Number(location.port) + 1) + '/frame.html';
  const POLICY = 'SecurityError: Midi has been disabled in this document by permissions policy.';
  await test('a cross-origin frame without allow="midi" is refused', async () => {
    eq(await frame(other), POLICY);
  });
  await test('a cross-origin frame with allow="midi" uses the top site\u2019s permission', async () => {
    eq(await frame(other, 'midi'), 'MIDIAccess');
    eq(await harness('notice'), null, 'not asked again');
  });
  await test('allow="midi *" lets any origin in', async () => {
    eq(await frame(other, 'camera; midi *'), 'MIDIAccess');
  });
  await test('an allowlist naming another origin keeps the frame out', async () => {
    eq(await frame(other, 'midi https://example.com'), POLICY);
  });
  await test('allow="midi \'none\'" refuses even a same-origin frame', async () => {
    eq(await frame('/frame.html', "midi 'none'"), POLICY);
  });
  await test('a frame\u2019s permission query follows the policy', async () => {
    eq(await frame(other + '?query'), 'denied');
    eq(await frame(other + '?query', 'midi'), 'granted');
  });

  await test('a frame reloaded at the same URL under a new allow is asked about afresh', async () => {
    // Same URL, so the same frame id; a new document, so a new answer.  Keyed
    // by frame and URL, the first allow outlived the change (the audit,
    // 2026-09-27).
    const f = document.createElement('iframe');
    const next = () => new Promise(r => addEventListener('message', function on(e) {
      if (e.source === f.contentWindow) { removeEventListener('message', on); r(e.data); }
    }));
    const src = other + '?n=reloaded';
    f.setAttribute('allow', 'midi');
    let got = next();
    f.src = src;
    document.body.append(f);
    eq(await within(got, 5000, 'the first answer'), 'MIDIAccess');
    f.setAttribute('allow', "midi 'none'");
    got = next();
    f.src = src;
    eq(await within(got, 5000, 'the answer after the reload'), POLICY);
  });

  await test('frames within frames: each container\u2019s allow must let the next in', async () => {
    const top = encodeURIComponent(location.origin);
    eq(await frame(other + '?nest=midi&top=' + top, 'midi'), 'MIDIAccess');
    eq(await frame(other + '?nest=none&top=' + top, 'midi'), POLICY);
  });

  // --- input a page never saw ------------------------------------------------------
  await test('a new page reads no input from before it started', async () => {
    // Traffic from this page first, so the hub has something to give away.
    loop.inp.onmidimessage = () => {};
    for (let i = 0; i < 8; i++) loop.out.send([0x96, i, 1]);
    await sleep(300);
    // A same-origin frame asks the extension directly, from the start.
    eq(await frame('/frame.html?history'), 'events: 0');
  });

  // --- last: taking the permission away -----------------------------------------
  await test('a PermissionStatus fires "change" when the site is reset', async () => {
    const st = await navigator.permissions.query({ name: 'midi' });
    eq(st.state, 'granted');
    const changed = waitFor(st, 'change', null, 3000);
    await harness('forget', { origin: location.origin });
    await changed;
    eq(st.state, 'prompt');
  });

  webkit.messageHandlers.done.postMessage(results);
})();
</script>
