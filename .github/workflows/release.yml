# Makes each new disk image a GitHub release: pushing a changed
# site/Web-MIDI.dmg to main tags v<version> on that commit and attaches the
# image (tools/release.sh).  Run it by hand with a commit for a disk image
# that shipped before this workflow existed.
name: release
on:
  push:
    branches: [main]
    paths: ['site/Web-MIDI.dmg']
  workflow_dispatch:
    inputs:
      commit:
        description: 'The commit whose site/Web-MIDI.dmg to release (default: the latest)'
        required: false
      draft:
        description: 'Make a draft release'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # macOS, to open the disk image and check its staples and signature.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release the disk image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: ./tools/release.sh ${COMMIT:+"$COMMIT"} $DRAFT
